          "type": "string"
        "refresh_token":
          "type": "string"
        "token_type":
          "type": "string"
        "expires_in":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "user":
          "$ref": "#/components/schemas/User"
    "Login":
      "type": "object"
      "properties":
        "email":
          "type": "string"
          "format": "email"
        "password":
