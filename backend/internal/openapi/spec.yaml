          "format": "int64"
          "minimum": 1
        "branch_id":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "email":
          "type": "string"
        "full_name":
          "type": "string"
        "role":
          "type": "string"
          "enum":
            - "waiter"
            - "cashier"
            - "chef"
            - "branch_manager"
            - "hq_manager"
            - "customer"
    "TokenPair":
      "type": "object"
      "properties":
