"openapi": "3.0.3"
"info":
  "title": "SofraPOS API"
  "version": "1.1.0"
  "description": "Go/Fiber + PostgreSQL 16. Tutarlar tam sayı kuruştur. Tüm yanıtlar X-DDO-Case: cc6433 taşır. Merkez yönetim tüm şubelere, diğer personel yalnızca kendi şubesine erişir. Kritik mutasyonlar transaction, şube kilidi ve kullanıcı/metot/yol kapsamlı Idempotency-Key ile korunur. Aynı anahtar farklı gövdeyle 409 döner."
"servers":
  -
    "url": "http://localhost:8080"
"security":
  -
    "bearerAuth": []
