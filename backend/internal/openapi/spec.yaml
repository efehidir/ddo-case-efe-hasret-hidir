                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Rol/şube yetkisi yok"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Kaynak bulunamadı"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Versiyon, bakiye veya idempotans çakışması"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "500":
          "description": "İşlem geri alındı"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "503":
          "description": "Veritabanı erişilemiyor"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "bearerAuth": []
      "x-roles":
        - "hq_manager"
"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  "schemas":
    "Error":
      "type": "object"
      "properties":
        "error":
          "type": "object"
          "properties":
            "code":
              "type": "string"
            "message":
              "type": "string"
          "required":
            - "code"
            - "message"
      "required":
