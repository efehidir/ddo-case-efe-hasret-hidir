services:
  postgres:
    image: postgres:16-alpine
    container_name: ddo-postgres
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ddo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddo_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ddo_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ddo_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ddo_user} -d ${POSTGRES_DB:-ddo_db} -h 127.0.0.1 -p 5432"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ddo-backend:latest
    container_name: ddo-marul-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-ddo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddo_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ddo_db}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-25}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-5}
      DATABASE_URL: ${DATABASE_URL:-postgres://ddo_user:ddo_secret_password_2026@postgres:5432/ddo_db?sslmode=disable}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_SECRET: ${JWT_SECRET:-sofrapos-super-secret-jwt-key-2026-cc6433}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ddo_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  simulator:
    image: ddo-backend:latest
    container_name: ddo-simulator
    restart: unless-stopped
    entrypoint: ["/app/simulator"]
    environment:
      API_URL: http://backend:8080
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
      SIMULATOR_INTERVAL_SEC: ${SIMULATOR_INTERVAL_SEC:-6}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ddo_internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/simulator || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    image: ddo-frontend:latest
    container_name: ddo-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ddo_internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  verify:
    image: ddo-backend:latest
    container_name: ddo-verify
    profiles:
      - verify
    entrypoint: ["/app/verify"]
    environment:
      API_URL: http://backend:8080
      FRONTEND_URL: http://frontend:3000
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ddo_internal

networks:
  ddo_internal:
    driver: bridge

volumes:
  postgres_data:
