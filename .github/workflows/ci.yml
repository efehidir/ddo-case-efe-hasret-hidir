name: Build, lint, race, coverage and live verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - run: go mod verify
      - name: Lint and static analysis
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: Tests, race detector and enforced assignment thresholds
        run: |
          go test -json -race -coverprofile=coverage.out ./... > test-results.jsonl
          python3 scripts/check_quality.py
          go tool cover -func=coverage.out
      - run: go build ./cmd/...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: |
            backend/coverage.out
            backend/test-results.jsonl
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start all four non-root services
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          curl -fsSi http://localhost:8080/health | grep -i 'X-DDO-Case: cc6433'
          curl -fsS http://localhost:8080/_hz/cc64 | grep '"status":"ok"'
      - name: Verify against PostgreSQL with simulator isolation
        run: make verify
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
